services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/html/smart-real-estate-management-system:cached
    ports:
      - "3000:3000"
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=smartre_root
      - DB_NAME=smartre_db
      - APP_URL=http://localhost:8080
      - APP_ENV=development
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000,https://*.app.github.dev

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: smartre_root
      MARIADB_DATABASE: smartre_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
